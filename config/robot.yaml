# =========================================================================
#             JUMPING WHEEL-LEGGED ROBOT — CONFIGURATION SCHEMA
#                         Developed for UCR MEDDL Lab
# =========================================================================

# ── ARDUINO UNO R3 TELEMETRY LINK ────────────────────────────────────────
# Coordinates wheel control LQR loops, encoder interrupts, and MPU6050 feed.
arduino:
  device_linux: /dev/ttyACM0
  device_win: COM1
  device_mac: /dev/tty.usbserial
  baudrate: 115200

# ── BLS3355 BRUSHLESS HIP JOINTS ─────────────────────────────────────────
# BLS3355: 61 kg·cm, 6.0–8.4 V (2S LiPo). These are standard RC PWM servos,
# NOT serial-bus servos — the Arduino generates 50 Hz pulses on D12/D11 and the
# Pi commands them with SRV:<id>:<pulse_us> over the 115200-baud serial link.
# IMPORTANT: max supply voltage is 8.4 V — do NOT run on 3S LiPo (12 V).
bls:
  # The hips share the Arduino serial link (see the arduino: block above) —
  # there is no dedicated servo bus, so no device/baudrate keys here.

  # Individual joint parameters
  # default_us: stance pulse width in μs (500–2500, 1500 = neutral).
  # Calibrate by hand after installation, then mirror the calibrated values
  # into SERVO_BOOT_LEFT_US / SERVO_BOOT_RIGHT_US in robot_control.ino so
  # the Arduino boots into the same stance.
  # Observed on hardware: a mirrored pulse pair (1540/1460) moved the legs in
  # OPPOSITE directions, so the same pulse offset moves both legs the SAME
  # way. Both hips get the same pulse and the same direction multiplier.
  # 1580 = both legs ≈+10.8° (≈10° target, nearest firmware tick) — lower stance.
  left:
    id: 1
    default_us: 1600     # left leg ≈+10° (lower stance) — matches SERVO_BOOT_LEFT_US
    offset_rad: 0.0
    direction: 1
    min_rad: -1.5708
    max_rad: 1.5708
  right:
    id: 2
    default_us: 1900     # right leg ≈+10° (lower stance) — matches SERVO_BOOT_RIGHT_US
    offset_rad: 0.0
    direction: 1
    min_rad: -1.5708
    max_rad: 1.5708

# ── DC DRIVE WHEELS (JGB-520 MOTORS) ────────────────────────────────────
# Governs wheel geometry and encoder configurations for speed averaging.
wheels:
  encoder_ppr: 660
  wheel_circumference_m: 0.204   # π × 0.065 m diameter (matches firmware WHEEL_CIRC)
  max_speed_pwm: 180
  max_turn_pwm: 80

  # Individual wheel configurations (aligned with physical drivers)
  left:
    id: 1                  # Motor 1 / Channel A
    direction: 1           # Direction multiplier (1 = normal)
  right:
    id: 2                  # Motor 2 / Channel B
    direction: -1          # Direction multiplier (-1 = mirrored mounting)

# ── BALANCE DYNAMICS (offline LQR gain design) ───────────────────────────
# Used by scripts/compute_lqr_gain.py to solve the Riccati equation and
# write config/lqr_gains.json.  Re-run compute_lqr_gain.py after any
# change to robot mass, geometry, or cost weights.
physical:
  total_mass_kg:       2.5      # whole robot incl. all components
  wheel_mass_kg:       0.10     # per wheel (drive motors live in chassis -> light wheels)
  wheel_radius_m:      0.0325   # 65 mm diameter (firmware WHEEL_CIRC = 0.204 m)
  com_height_m:        0.58     # axle -> chassis/COM, FULLY-EXTENDED stance (measured)
  pitch_inertia_kgm2:  0.012    # chassis box about its own COM (small vs m·L²)

  # LQR cost weights for state [x, xdot, pitch, pitch_rate] and input u
  q_weights: [80.0, 20.0, 400.0, 25.0]
  r_weight:  0.02

  # torque (N·m) -> motor PWM (0–255). Seeded so the LQR pitch gain reproduces
  # the known-good PID kpAngle≈45 PWM/deg response. TUNE THIS ON HARDWARE.
  torque_to_pwm: 7.8
